name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Build
      working-directory: backend
      run: go build ./...

    - name: Vet
      working-directory: backend
      run: go vet ./...

    - name: Test
      working-directory: backend
      run: go test ./...
