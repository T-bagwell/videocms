name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: videocms
          POSTGRES_PASSWORD: videocms
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Build
      working-directory: backend
      run: go build ./...

    - name: Vet
      working-directory: backend
      run: go vet ./...

    - name: Test (unit + PostgreSQL integration)
      working-directory: backend
      env:
        TEST_PG_DSN: postgres://videocms:videocms@localhost:5432/postgres?sslmode=disable
      run: go test ./...

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v1.64.8
        working-directory: backend
