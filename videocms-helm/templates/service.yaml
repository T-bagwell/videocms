apiVersion: v1
kind: Service
metadata:
  name: {{ include "videocms.fullname" . }}
  labels:
    {{- include "videocms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "videocms.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
