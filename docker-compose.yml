services:
  db:
    image: postgres:14-alpine
    container_name: videocms-db
    environment:
      POSTGRES_DB: videocms
      POSTGRES_USER: videocms
      POSTGRES_PASSWORD: videocms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videocms -d videocms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

